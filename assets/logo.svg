<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="Markspread">
  <defs>
    <linearGradient id="ms-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86e8"/>
      <stop offset="1" stop-color="#7b5fe0"/>
    </linearGradient>
    <linearGradient id="ms-logo-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b86e8"/>
      <stop offset="1" stop-color="#7b5fe0"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(24,34)">
    <rect width="132" height="132" rx="30" fill="url(#ms-logo-bg)"/>
    <path d="M 34.8 99.1 L 34.8 37.4 L 66 72.4 L 97.2 37.4 L 97.2 99.1"
          fill="none" stroke="#ffffff" stroke-width="16.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="188" y="108"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-1.5"
        fill="url(#ms-logo-text)">Markspread</text>

  <!-- tagline -->
  <text x="190" y="150"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="23" font-weight="500"
        fill="#8b95a7">Lightweight markdown reviewer for the AI era</text>
</svg>
