# ─── Rust: unic-* family ────────────────────────────────────────────
# `unic` crates were last published 2019 and are now marked
# unmaintained. We pull them through `idna` -> `unicode-bidi`, which the
# `idna` maintainers replaced in idna 1.0 (Sep 2024); Tauri's `url`
# pin still resolves to idna 0.5. Tracked upstream in
# servo/rust-url#929; bumps with Tauri 3.
