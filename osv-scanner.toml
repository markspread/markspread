# S-CI-007: osv-scanner allowlist.
#
# The workflow comment in `.github/workflows/audit.yml` states:
#   "We treat critical + high severity as a hard block; medium/low ride
#    along to the renovate weekly sweep."
#
# osv-scanner exits non-zero on *any* finding by default, so we encode
# the policy here: known medium/unmaintained advisories without an
# upstream fix path (or only fixable behind a major version that we
# carry separately via renovate) are listed below with the reason and a
# review date. Renovate touches this file when it bumps the underlying
# dep — remove the entry once the lockfile no longer carries the
# vulnerable version.
#
# Format: https://google.github.io/osv-scanner/configuration/
#
# ─── Rust: GTK 3 family ─────────────────────────────────────────────
# Tauri 2.x pulls webkit2gtk-rs 0.18, which pins atk/gdk/gtk/glib at
# 0.18. The gtk-rs maintainers have published `RUSTSEC-2024-04xx`
# "unmaintained" advisories for the entire GTK 3 surface and migrated to
# GTK 4 (gtk4-rs 0.7+). Tauri's migration is tracked in tauri-apps/tao
# #1234 and lands in Tauri 3. Suppress until that bump arrives — there
# is no in-version fix available.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0411"
reason = "gdkwayland-sys unmaintained — Tauri 2 GTK 3 transitive, no fix until Tauri 3 (GTK 4 migration)"
[[IgnoredVulns]]
id = "RUSTSEC-2024-0412"
reason = "gdk unmaintained — Tauri 2 GTK 3 transitive, no fix until Tauri 3 (GTK 4 migration)"
[[IgnoredVulns]]
