# S-CI-006: cargo-deny configuration.
#
# We mirror the SPDX allow-list from `src/lib/security/licence-check.ts`
# so a single allow-list governs both Node and Rust dependency trees.
# When a transitive dep ships under an unfamiliar licence, the fix is
# either: pin to a different version, replace the dep, or add a
# considered exception here (with a comment + a tracking ticket).

# cargo-deny ≥0.15 (EmbarkStudios/cargo-deny#611) removed `unlicensed`,
# `copyleft`, `allow-osi-fsf-free` and `default`: the [licenses] section
# is now allow-list-only, and anything not in `allow` is denied — which
# is exactly the semantics the removed keys expressed here.
[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "BlueOak-1.0.0",
  "0BSD",
  # Mirrors SAFE_LICENCES in licence-check.ts, which lists this
  # expression literally. In the Rust tree it covers target-lexicon
  # (cranelift/wasmtime project), pulled transitively by Tauri.
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# `ring` ships under a custom licence text but the OSI/FSF interpret it
# as Apache-2.0-compatible. We pin the exception narrowly.
name = "ring"
allow = ["LicenseRef-ring"]

# Our own crate. The app is deliberately AGPL-3.0-only (see [package]
# in Cargo.toml and the repo LICENSE); the allow-list above governs
# *dependencies*, so the project's own licence gets a pinned exception
# rather than a global copyleft allowance.
[[licenses.exceptions]]
name = "markspread"
allow = ["AGPL-3.0-only"]

# MPL-2.0 transitives — all unavoidable and all consumed unmodified.
# MPL-2.0 is file-level weak copyleft: using unmodified crates imposes
# no obligations on our AGPL app code. cssparser/cssparser-macros/
# dtoa-short/selectors arrive via dom_query ← tauri-utils 2.9 (Tauri 2
# runtime, no alternative version without them); option-ext arrives via
# dirs. Pinned per-crate so any *new* MPL dep still trips the check and
# gets its own review.
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

# webpki-roots ships Mozilla's CA certificate data under the permissive
# CDLA-Permissive-2.0 data licence (standard for webpki-roots ≥0.26).
# Transitive via reqwest → rustls; unavoidable while we use rustls.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # Pulled into examples by accident historically; never in our shipping graph.
  { name = "openssl-sys", reason = "We rely on rustls; openssl shouldn't appear in the graph." },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
