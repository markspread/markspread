[package]
name = "markspread"
version = "0.1.0"
description = "Markspread — lightweight markdown reviewer for the AI era"
authors = ["Markspread Contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/markspread/markspread"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markspread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
fs4 = "0.9"
trash = "5"
reflink-copy = "0.1"
chardetng = "0.1"
encoding_rs = "0.8"
notify = "6"
notify-debouncer-mini = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
unicode-normalization = "0.1"
tauri-plugin-single-instance = "2.0"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdb = "0.21"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
flate2 = "1"
tar = "0.4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

# S-TST-002: Rust test dependencies. We keep them here (single-package
# layout) and run with `cargo test` by default; CI prefers `cargo
# nextest run` (config under `.config/nextest.toml`) for parallelism +
# JUnit output.
[dev-dependencies]
tempfile = "3.13"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
serial_test = "3"
pretty_assertions = "1"
wiremock = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
