# S-TST-019: multi-OS smoke matrix.
#
# Three layers, each cheaper than the next so a fast loop catches most
# regressions:
#
#   unit          ubuntu only — vitest + cargo test, ~2 min
#   smoke matrix  macos-14 (arm64), macos-15-intel (intel), windows-latest
#                 (x64), ubuntu-latest (x64) — runs the renderer e2e
#                 against `pnpm tauri build --debug` and walks the
#                 first-launch + create-workspace flow only. ~12 min.
#   visual + a11y  ubuntu only, parked behind labels.
#
# The smoke matrix is the gate: it must pass on all four OSes before a
# PR can merge to main, mirroring the platforms we ship binaries for.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PNPM_VERSION: 9

jobs:
  unit:
    name: Unit tests (vitest + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: src-tauri -> target }
      - name: Vitest
        run: pnpm vitest run --coverage
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            test-results/

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel   # Intel — keeps x86_64 macOS coverage on a supported runner image
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: corepack enable && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { targets: "${{ matrix.target }}" }

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: src-tauri -> target }

      - name: Linux runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Tauri (debug)
        run: pnpm tauri build --debug --target ${{ matrix.target }}
        env:
          MARKSPREAD_E2E: "1"

      - name: Smoke — first launch + create workspace
        env:
          MARKSPREAD_AI_MOCK: "1"
        run: |
          pnpm exec playwright test --project=renderer --grep "first-launch|workspace-authoring"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/

  visual:
    name: Visual regression (Linux only)
    if: contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=renderer --grep "visual:"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=renderer --grep "a11y:"
