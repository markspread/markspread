name: perf-cold-start

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/perf-cold-start.yml"
  workflow_dispatch:

env:
  RUNS: "5"

jobs:
  cold-start-mac:
    name: Cold start (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            p50: "500"
            p95: "700"
          - label: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            p50: "800"
            p95: "1100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          key: cold-start-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build release bundle
        run: pnpm tauri build --bundles app --target ${{ matrix.target }}
      - name: Measure cold start
        shell: bash
        env:
          P50_BUDGET_MS: ${{ matrix.p50 }}
          P95_BUDGET_MS: ${{ matrix.p95 }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/${TARGET}/release/bundle/macos/Markspread.app"
          test -d "$APP" || { echo "::error::App bundle missing"; exit 1; }
          BIN="$APP/Contents/MacOS/Markspread"
          MEASURE=$(mktemp)
          for i in $(seq 1 "$RUNS"); do
            sudo /usr/sbin/purge || true
            START=$(python3 -c "import time;print(int(time.time()*1000))")
            "$BIN" --headless-cold-start || true &
            PID=$!
            timeout 15 bash -c "while ! pgrep -P $PID >/dev/null; do sleep 0.05; done" || true
            sleep 1
            kill "$PID" 2>/dev/null || true
            END=$(python3 -c "import time;print(int(time.time()*1000))")
            echo $((END - START)) >> "$MEASURE"
          done
          python3 - <<PY
          import statistics, os, sys
          values = sorted(int(x) for x in open("$MEASURE") if x.strip())
          if not values:
              print("::error::no measurements"); sys.exit(1)
          p50 = statistics.median(values)
          p95 = values[int(len(values)*0.95) - 1] if len(values) > 1 else values[-1]
          print(f"runs={values}")
          print(f"p50={p50}ms p95={p95}ms")
          p50_b = int(os.environ["P50_BUDGET_MS"])
          p95_b = int(os.environ["P95_BUDGET_MS"])
          fail = p50 > p50_b or p95 > p95_b
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Cold start ({os.environ['LABEL']})\n\np50: {p50}ms / budget {p50_b}ms\n\np95: {p95}ms / budget {p95_b}ms\n")
          sys.exit(1 if fail else 0)
          PY

  cold-start-windows:
    name: Cold start (Windows x64, defender ${{ matrix.defender }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - defender: "off"
            p50: "1000"
            p95: "1400"
          - defender: "on"
            p50: "1500"
            p95: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          key: cold-start-x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Disable Defender real-time scan (matrix off)
        if: matrix.defender == 'off'
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Warning $_ }
      - name: Build release bundle
        run: pnpm tauri build --bundles app --target x86_64-pc-windows-msvc
      - name: Measure cold start
        shell: pwsh
        env:
          P50_BUDGET_MS: ${{ matrix.p50 }}
          P95_BUDGET_MS: ${{ matrix.p95 }}
          DEFENDER: ${{ matrix.defender }}
        run: |
          $exe = "src-tauri\target\x86_64-pc-windows-msvc\release\Markspread.exe"
          if (-not (Test-Path $exe)) { Write-Error "binary missing"; exit 1 }
          $runs = @()
          for ($i = 1; $i -le [int]$env:RUNS; $i++) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList "--headless-cold-start" -PassThru
            Start-Sleep -Milliseconds 1500
            $sw.Stop()
            try { Stop-Process -Id $p.Id -Force } catch {}
            $runs += [int]$sw.ElapsedMilliseconds
          }
          $sorted = $runs | Sort-Object
          $p50 = $sorted[[int]([math]::Floor($sorted.Count/2))]
          $p95Index = [int][math]::Max(0, [math]::Floor($sorted.Count * 0.95) - 1)
          $p95 = $sorted[$p95Index]
          $p50b = [int]$env:P50_BUDGET_MS; $p95b = [int]$env:P95_BUDGET_MS
          "## Cold start (Windows x64, defender $env:DEFENDER)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "p50: $p50 ms / budget $p50b ms" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "p95: $p95 ms / budget $p95b ms" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "runs=$($runs -join ',')"
          if ($p50 -gt $p50b -or $p95 -gt $p95b) { exit 1 }
