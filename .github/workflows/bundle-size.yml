# S-CI-005: bundle-size delta comment on PRs.
#
# Build the renderer twice — once on the PR head, once on the base —
# diff the per-asset sizes, post a sticky comment with the +/- table.
# The job is non-blocking (it doesn't fail the PR), but a regression
# above the bundle ceiling fails `bundle-size` in `perf.yml`.
#
# We use a sticky comment (`marocchino/sticky-pull-request-comment`) so
# repeated runs replace the prior comment instead of stacking.

name: bundle-size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}", path: head }

      - name: Check out base
        uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.sha }}", path: base }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build head
        working-directory: head
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm vite build --mode production
          node scripts/perf/bundle-stats.mjs > ../head-stats.json

      - name: Build base
        working-directory: base
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm vite build --mode production
          node scripts/perf/bundle-stats.mjs > ../base-stats.json

      - name: Compose comment
        id: compose
        run: |
          node head/scripts/perf/bundle-diff.mjs base-stats.json head-stats.json > comment.md
          {
            echo "body<<EOF"
            cat comment.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: bundle-size-report
          message: ${{ steps.compose.outputs.body }}
