name: a11y-checks

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/a11y-checks.yml"
  push:
    branches: [main]

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: jest-axe (S-A11-001)
        run: bun x vitest run src/__tests__/a11y-axe.test.tsx
      - name: positive tabindex lint (S-A11-002)
        run: node scripts/check-tabindex.mjs
      - name: WCAG AA contrast (S-A11-007)
        run: node scripts/check-contrast.mjs
