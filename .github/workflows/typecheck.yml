# S-CI-002: PR typecheck — tsc.
#
# Lint catches stylistic issues; this job catches the structural ones on
# the TypeScript side. The Rust half is covered by `lint.yml`'s clippy
# run, which compiles `--all-targets --all-features` and so subsumes a
# separate `cargo check`.
# We run `tsc --noEmit` over the renderer and every workspace package
# so a renderer change that breaks an SDK consumer is flagged here.

name: typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Renderer
        run: pnpm tsc --noEmit -p tsconfig.json
      # Workspace packages are enumerated by pnpm rather than named
      # one-by-one: a `--filter` that matches nothing exits 0, so a
      # renamed or added package would silently stop being checked.
      - name: Workspace packages
        run: pnpm -r --filter '!markspread' exec tsc --noEmit
