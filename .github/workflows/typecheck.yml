# S-CI-002: PR typecheck — tsc + cargo check.
#
# Lint catches stylistic issues; this job catches the structural ones.
# We use `tsc --noEmit -p tsconfig.json` against every project ref in
# the workspace so a renderer change that breaks an SDK consumer is
# flagged here. Cargo check (without `--all-targets`) is faster than
# clippy and gives the same compilation guarantees minus lints.

name: typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Renderer
        run: pnpm tsc --noEmit -p tsconfig.json
      - name: SDK
        run: pnpm --filter @markspread/sdk exec tsc --noEmit
      - name: CLI
        run: pnpm --filter @markspread/cli exec tsc --noEmit

  cargo-check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - name: Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-features --all-targets
