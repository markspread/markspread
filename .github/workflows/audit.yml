# S-CI-007: PR security audit.
#
# Three tools cover the dependency graph:
#   - `pnpm audit`    — npm advisory database
#   - `cargo audit`   — RustSec advisory database
#   - `osv-scanner`   — OSV.dev cross-ecosystem (catches advisories the
#                       previous two miss, especially Go binaries we
#                       embed for tauri-driver / sidecars)
#
# We treat critical + high severity as a hard block; medium/low ride
# along to the renovate weekly sweep so a 5pm PR doesn't get blocked on
# a low-severity transitive dep that has no upgrade path.

name: audit

on:
  pull_request:
  schedule:
    # Daily at 03:00 KST so a freshly published advisory blocks the next
    # PR even if no dep file changed.
    - cron: "0 18 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@f7ae479469b4c4fb5c1818615346605e61b5dc27 # cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        # No --deny warnings: vulnerabilities still fail the build, but the
        # gtk-rs GTK3 "unmaintained" advisories are unavoidable transitive
        # deps of Tauri on Linux and would otherwise hard-block every run.
        run: cargo audit

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # `--skip-git` was removed in osv-scanner v2 (the action's flag
          # parser rejects it). Recursive directory scan implicitly skips
          # git history, so the flag is no longer needed.
          scan-args: |
            --recursive
            ./
